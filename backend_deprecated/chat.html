<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Prosto AI - Specialized Dental Assistant</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- Marked.js for Markdown Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            /* ProstoCalc Design System Tokens */
            --dental-dark: #0D2659;
            --dental-light: #40A6F2;
            --dental-cyan: #00D9F2;
            --medical-bg: #F7FAFF;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1A2B47;
            --text-muted: #64748B;
            --shadow-premium: 0 12px 30px -10px rgba(13, 38, 89, 0.1);
            --bubble-radius: 20px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--medical-bg);
            background-image:
                linear-gradient(rgba(64, 166, 242, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(64, 166, 242, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            /* Dynamic viewport height */
            overscroll-behavior: none;
            overflow: hidden;
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* --- Header: Clinical Glass --- */
        header {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 16px 20px;
            padding-top: max(16px, env(safe-area-inset-top));
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            z-index: 100;
            box-shadow: 0 4px 20px rgba(13, 38, 89, 0.05);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-status-orb {
            width: 10px;
            height: 10px;
            background: var(--dental-cyan);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px var(--dental-cyan);
        }

        .ai-status-orb::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 1px solid var(--dental-cyan);
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        .header-brand h1 {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--dental-dark), var(--dental-light));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Chat Main View --- */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        /* Welcome/Empty State */
        #empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

        .empty-icon {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-premium);
            margin-bottom: 20px;
        }

        .empty-icon svg {
            color: var(--dental-light);
            width: 50px;
            height: 50px;
        }

        /* --- Message Bubbles --- */
        .msg-group {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .user-group {
            align-self: flex-end;
            align-items: flex-end;
        }

        .ai-group {
            align-self: flex-start;
            align-items: flex-start;
        }

        .msg-sender {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 6px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .bubble {
            padding: 14px 20px;
            border-radius: var(--bubble-radius);
            font-size: 0.95rem;
            line-height: 1.55;
            box-shadow: var(--shadow-premium);
            position: relative;
        }

        .user-bubble {
            background: linear-gradient(145deg, var(--dental-dark), var(--dental-light));
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai-bubble {
            background: white;
            color: var(--text-main);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--glass-border);
        }

        /* Markdown Contents */
        .ai-bubble p {
            margin: 0 0 10px 0;
        }

        .ai-bubble p:last-child {
            margin-bottom: 0;
        }

        .ai-bubble code {
            background: #F1F5F9;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }

        .ai-bubble ul {
            padding-left: 20px;
            margin: 10px 0;
        }

        /* --- Typing Reveal --- */
        .typing-box {
            display: flex;
            gap: 5px;
            padding: 8px 12px;
            background: rgba(64, 166, 242, 0.05);
            border-radius: 12px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--dental-light);
            border-radius: 50%;
            opacity: 0.4;
            animation: dotWave 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dotWave {

            0%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            50% {
                transform: translateY(-4px);
                opacity: 1;
            }
        }

        /* --- Input Panel: Floating Glass --- */
        #controls {
            padding: 10px 20px;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, var(--medical-bg) 50%, rgba(247, 250, 255, 0));
            z-index: 10;
        }

        .input-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 6px 6px 6px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(13, 38, 89, 0.08);
            transition: all 0.3s;
        }

        .input-glass:focus-within {
            border-color: var(--dental-light);
            box-shadow: 0 15px 40px rgba(64, 166, 242, 0.15);
            transform: translateY(-2px);
        }

        #message-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 1rem;
            outline: none;
            color: var(--text-main);
        }

        #message-input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .send-pill {
            background: linear-gradient(135deg, var(--dental-light), var(--dental-cyan));
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(64, 166, 242, 0.3);
        }

        .send-pill:active {
            transform: scale(0.92);
        }

        .send-pill:disabled {
            opacity: 0.5;
            filter: grayscale(1);
        }

        /* --- Quick Suggestions --- */
        .suggestions {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            scrollbar-width: none;
        }

        .suggestions::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: white;
            border: 1px solid var(--glass-border);
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--dental-dark);
            white-space: nowrap;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .chip:hover {
            border-color: var(--dental-light);
            background: rgba(64, 166, 242, 0.05);
            transform: translateY(-1px);
        }

        /* --- Modal Overlays --- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 38, 89, 0.4);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: cardPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group textarea,
        .input-group input {
            width: 100%;
            background: var(--medical-bg);
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .btn-set {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-main {
            background: var(--dental-dark);
            color: white;
        }

        .btn-ghost {
            background: #F1F5F9;
            color: var(--text-muted);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cardPop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body onload="initApp()">
    <header>
        <div class="header-brand">
            <div class="ai-status-orb"></div>
            <h1>Prosto AI Specialist</h1>
        </div>
        <button id="settings-btn" style="background:none; border:none; cursor:pointer; color: var(--dental-dark);">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>
    </header>
    <div id="error-banner"
        style="display:none; position:fixed; top:70px; left:20px; right:20px; background:rgba(220, 38, 38, 0.9); color:white; padding:12px 20px; border-radius:12px; z-index:2000; backdrop-filter:blur(10px); font-size:0.9rem; text-align:center; box-shadow:var(--shadow-premium);">
    </div>


    <div id="chat-container">
        <!-- Messages appear here -->
        <div id="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    <path d="M8 9h8"></path>
                    <path d="M8 13h6"></path>
                </svg>
            </div>
            <h2 style="margin: 0 0 10px 0; color: var(--dental-dark);">Dental Knowledge Hub</h2>
            <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">Ask about prosthodontic
                procedures,<br>calculations, or terminology.</p>
        </div>
    </div>

    <div id="controls">
        <div class="suggestions">
            <div class="chip" onclick="quickSend('Explain vertical dimension')">Vertical Dimension</div>
            <div class="chip" onclick="quickSend('Calc occlusal force steps')">Occlusal Force</div>
            <div class="chip" onclick="quickSend('Prosthodontic terminology')">Terminology</div>
            <div class="chip" onclick="quickSend('Impression techniques')">Impressions</div>
        </div>
        <div class="input-glass">
            <input type="text" id="message-input" placeholder="Type clinical inquiry..." autocomplete="off">
            <button id="send-btn" class="send-pill">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-overlay" class="overlay">
        <div class="card">
            <h3 style="margin: 0 0 20px 0; color: var(--dental-dark);">AI CLINICAL CONFIG</h3>

            <div class="input-group">
                <label>System Identity Prompt</label>
                <textarea id="sys-prompt"
                    rows="5">You are a specialized Prosthodontic Consultant for the ProstoCalc app. 
Expertise: Removable Partial Dentures (RPD), Complete Dentures, Crown/Bridge, Implant Prosthetics.
Tone: Professional, direct, and very concise. 
Rules: Keep responses short and simple. Provide exact calculations only when asked. Avoid long introductions or conclusions. Format with lists if helpful.</textarea>
            </div>

            <div class="input-group">
                <label>Auth Credentials (Mistral)</label>
                <input type="password" id="api-key" placeholder="••••••••••••••••">
            </div>

            <div class="btn-set">
                <button class="btn btn-ghost" onclick="toggleSettings()">CANCEL</button>
                <button class="btn btn-main" onclick="saveSettings()">SAVE CHANGES</button>
            </div>
        </div>
    </div>

    <script>
        const HISTORY_API = "ai_chat_history.php";

        // Extract identity from URL for isolated history
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId') || '1';
        const userRole = urlParams.get('role') || 'patient';

        let MISTRAL_API_KEY = localStorage.getItem('mistral_key') || "O61k871Gs9E7Aku6JL57fmG3krJw6wwt";
        let SYSTEM_PROMPT = localStorage.getItem('system_prompt') || document.getElementById('sys-prompt').value;

        // Initialize marked.js
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        function log(msg, type = "LOG") {
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.consoleHandler) {
                window.webkit.messageHandlers.consoleHandler.postMessage(type + ": " + msg);
            }
            console.log(type + ": " + msg);
        }

        function createMessageElement(text, isUser) {
            const group = document.createElement('div');
            group.className = `msg-group ${isUser ? 'user-group' : 'ai-group'}`;

            const name = document.createElement('div');
            name.className = 'msg-sender';
            name.textContent = isUser ? 'You' : 'Prosto AI Specialist';
            group.appendChild(name);

            const bubble = document.createElement('div');
            bubble.className = `bubble ${isUser ? 'user-bubble' : 'ai-bubble'}`;

            if (isUser) {
                bubble.textContent = text;
            } else {
                bubble.innerHTML = marked.parse(text);
            }

            group.appendChild(bubble);
            return group;
        }

        function addMessage(text, isUser) {
            const emptyState = document.getElementById('empty-state');
            if (emptyState) emptyState.style.display = 'none';

            const container = document.getElementById('chat-container');
            container.appendChild(createMessageElement(text, isUser));
            scrollToBottom();
        }

        function showTypingIndicator() {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.id = 'typing-id';
            div.className = 'ai-group msg-group';
            div.innerHTML = `
                <div class="msg-sender">Prosto AI Specialist</div>
                <div class="bubble ai-bubble typing-box">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            container.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const el = document.getElementById('typing-id');
            if (el) el.remove();
        }

        function scrollToBottom() {
            const c = document.getElementById('chat-container');
            c.scrollTop = c.scrollHeight;
        }

        async function initApp() {
            if (MISTRAL_API_KEY) document.getElementById('api-key').value = MISTRAL_API_KEY;
            document.getElementById('sys-prompt').value = SYSTEM_PROMPT;

            // Apply Cyan theme if professional role
            if (userRole === 'dentist') {
                document.documentElement.style.setProperty('--dental-light', 'var(--dental-cyan)');
                document.querySelector('header h1').style.background = 'linear-gradient(135deg, var(--dental-dark), var(--dental-cyan))';
                document.querySelector('header h1').style.webkitBackgroundClip = 'text';
            }

            log(`Initializing AI for ${userRole} id ${userId}...`, "INFO");
            try {
                const response = await fetch(`${HISTORY_API}?user_id=${userId}&role=${userRole}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.length === 0) {
                        addMessage("Hello! I'm your Prosto AI. Ask me anything about prosthodontics briefly.", false);
                    } else {
                        data.forEach(item => {
                            addMessage(item.message, true);
                            addMessage(item.response, false);
                        });
                    }
                }
            } catch (e) {
                addMessage("Welcome! I'm your specialized Prosthodontic AI. Please ensure your API key is set in settings to begin.", false);
            }
        }

        async function saveChat(msg, resp) {
            try {
                await fetch(`${HISTORY_API}?user_id=${userId}&role=${userRole}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg, response: resp })
                });
            } catch (e) { log("History save failed", "WARN"); }
        }

        async function handleSend(customText = null) {
            const input = document.getElementById('message-input');
            const text = customText || input.value.trim();
            if (!text) return;

            if (!MISTRAL_API_KEY) {
                showError("Please set your Mistral API Key in Settings (top right).");
                toggleSettings();
                return;
            }

            if (!customText) input.value = '';
            addMessage(text, true);
            showTypingIndicator();

            try {
                const response = await fetch('https://api.mistral.ai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${MISTRAL_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "mistral-small-latest",
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT + " IMPORTANT: Answer in 1-2 very short sentences max. No preamble. No summary. Just the answer." },
                            { role: "user", content: text }
                        ],
                        temperature: 0.5,
                        max_tokens: 150
                    })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.message || "Mistral API Error");
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                removeTypingIndicator();
                addMessage(aiText, false);
                saveChat(text, aiText);

            } catch (e) {
                removeTypingIndicator();
                showError("AI Error: " + e.message);
                log(e.message, "ERROR");
            }
        }

        function quickSend(val) {
            handleSend(val);
        }

        function showError(msg) {
            const banner = document.getElementById('error-banner');
            banner.textContent = msg;
            banner.style.display = 'block';
            setTimeout(() => banner.style.display = 'none', 5000);
        }

        function toggleSettings() {
            const overlay = document.getElementById('settings-overlay');
            overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
        }

        function saveSettings() {
            MISTRAL_API_KEY = document.getElementById('api-key').value.trim();
            SYSTEM_PROMPT = document.getElementById('sys-prompt').value.trim();

            localStorage.setItem('mistral_key', MISTRAL_API_KEY);
            localStorage.setItem('system_prompt', SYSTEM_PROMPT);

            toggleSettings();
            addMessage("AI configuration updated successfully.", false);
        }

        document.getElementById('settings-btn').addEventListener('click', toggleSettings);
        document.getElementById('send-btn').addEventListener('click', () => handleSend());
        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Fixed height for keyboard issues on iOS
        window.visualViewport.addEventListener('resize', () => {
            document.body.style.height = window.visualViewport.height + 'px';
            scrollToBottom();
        });
    </script>
</body>

</html>
